<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dino vs. ChatGPT - Juego</title>
<style>
:root{--bg:#e6ecee;--ink:#1d2a2f;--ai:#10a37f;--ai2:#0a6f56;--panel:#f7fafa;--mute:#5d7077;--warn:#d6453d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10181b;--ink:#dfe9ec;--ai:#19c39a;--ai2:#0e8a6f;--panel:#1a272b;--mute:#8aa0a7;--warn:#ff6b60}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10181b;--ink:#dfe9ec;--ai:#19c39a;--ai2:#0e8a6f;--panel:#1a272b;--mute:#8aa0a7;--warn:#ff6b60}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,"Courier New",monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;box-sizing:border-box}

/* Estilo de la barra superior con el botón de volver */
.top-bar{width:min(100%,900px);display:flex;justify-content:space-between;align-items:center;}
.back-btn{color:var(--ink);text-decoration:none;background:var(--panel);border:1px solid var(--ink);padding:6px 12px;border-radius:6px;font-size:13px;transition:all .2s;}
.back-btn:hover{background:var(--ai);color:#fff;border-color:var(--ai);}

h1{margin:0;font-size:clamp(16px,3vw,22px);font-weight:700;letter-spacing:-.02em}
canvas{width:min(100%,900px);height:auto;aspect-ratio:3/1;background:var(--bg);border:2px solid var(--ink);border-radius:6px;touch-action:none;cursor:pointer;display:block}
canvas:focus-visible{outline:3px solid var(--ai);outline-offset:3px}
p{margin:0;max-width:60ch;text-align:center;font-size:14px;line-height:1.5;color:var(--mute)}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-btn">← Volver a la Pagina</a>
  <h1>Dino vs. ChatGPT</h1>
  <div style="width: 130px;"></div> <!-- Espaciador invisible para centrar el título -->
</div>

<canvas id="c" tabindex="0" aria-label="Juego: un dinosaurio escapa de ChatGPT"></canvas>
<p>Saltá los cactus con espacio o ↑. Agachate con ↓ para esquivar los mensajes de ChatGPT. En el celular: tocá arriba para saltar y mantené abajo para agacharte.</p>

<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const W=900,H=300,G=250,DX=130,MAXGAP=240;
const dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
if(!x.roundRect)x.roundRect=function(a,b,c,d){this.rect(a,b,c,d)};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// Carga del logo de ChatGPT descargado en la misma carpeta (cambiá 'logo.png' por el nombre de tu archivo)
const chatGPTLogo = new Image();
chatGPTLogo.src = 'logo.png';

const TXT=["Como modelo de lenguaje de OpenAI…","¡Excelente pregunta!","Claro, te explico en 5 puntos:","Pensando…","Aquí tienes un resumen:","Puedo ayudarte con eso.","¿Quieres que lo profundice?"];
let S,started=false,down=false,jumpBuf=0,best=0,C={};
try{best=+localStorage.getItem('dinoia-best')||0}catch(e){}
function reset(){S={t:0,dist:0,speed:300,dy:0,vy:0,duck:false,gap:MAXGAP,inv:0,shake:0,obs:[],bub:[],nextObs:1.2,nextBub:5,over:false,overT:0,
specks:Array.from({length:16},()=>({x:Math.random()*W,y:30+Math.random()*160,s:.15+Math.random()*.4}))}}
reset();
const score=()=>Math.floor(S.dist/10);
const edge=()=>DX+10-S.gap*.4;
function press(){
  if(!started){started=true;return}
  if(S.over){if(S.overT>.5)reset();return}
  jumpBuf=.14;
}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)press()}
  if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();down=true}
});
addEventListener('keyup',e=>{if(['ArrowDown','KeyS'].includes(e.code))down=false});
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  if(started&&!S.over&&(e.clientY-r.top)>r.height*.6){down=true}else press();
});
addEventListener('pointerup',()=>{down=false});
addEventListener('pointercancel',()=>{down=false});
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function hit(){
  if(S.inv>0)return false;
  S.gap-=75;S.inv=1;S.shake=reduce?0:.25;
  if(S.gap<=0){S.gap=0;S.over=true;S.overT=0;
    if(score()>best){best=score();try{localStorage.setItem('dinoia-best',best)}catch(e){}}}
  return true;
}
function update(dt){
  S.t+=dt;
  S.speed=Math.min(640,S.speed+5*dt);
  S.dist+=S.speed*dt;
  jumpBuf-=dt;S.inv-=dt;S.shake-=dt;
  if(jumpBuf>0&&S.dy===0){S.vy=620;jumpBuf=0}
  S.vy-=(down&&S.dy>0?4800:1900)*dt;
  S.dy+=S.vy*dt;
  if(S.dy<=0){S.dy=0;S.vy=0}
  S.duck=down&&S.dy===0;
  const maxGap=Math.max(110,MAXGAP-S.dist/220);
  S.gap=Math.min(maxGap,S.gap+8*dt);
  S.nextObs-=dt;
  if(S.nextObs<=0){
    const k=Math.floor(Math.random()*3);
    S.obs.push({x:W+20,k,w:[18,22,44][k],h:[38,56,40][k]});
    S.nextObs=(460+Math.random()*460)/S.speed;
  }
  S.nextBub-=dt;
  if(S.nextBub<=0){
    if(S.obs.some(o=>o.x>DX-20&&o.x<DX+280)){S.nextBub=.5}
    else{
      x.font='13px ui-monospace,monospace';
      const text=TXT[Math.floor(Math.random()*TXT.length)];
      S.bub.push({wait:.9,x:0,text,w:x.measureText(text).width+24});
      S.nextBub=3+Math.random()*3;
    }
  }
  for(const o of S.obs)o.x-=S.speed*dt;
  S.obs=S.obs.filter(o=>o.x>-70);
  for(const b of S.bub){
    if(b.wait>0){b.wait-=dt;if(b.wait<=0)b.x=edge()-10}
    else b.x+=380*dt;
  }
  S.bub=S.bub.filter(b=>b.wait>0||b.x<W+60);
  const hh=S.duck?26:46;
  const db={x:DX+8,y:G-S.dy-hh+3,w:S.duck?38:30,h:hh-6};
  for(const o of S.obs.slice()){
    if(overlap(db,{x:o.x+2,y:G-o.h,w:o.w-4,h:o.h})&&hit())S.obs.splice(S.obs.indexOf(o),1);
  }
  for(const b of S.bub.slice()){
    if(b.wait<=0&&overlap(db,{x:b.x,y:G-64,w:b.w,h:26})&&hit())S.bub.splice(S.bub.indexOf(b),1);
  }
  for(const s of S.specks){s.x-=S.speed*s.s*dt;if(s.x<-4){s.x=W+4;s.y=30+Math.random()*160}}
}
const SPR=["      ########","     ##########","     ## #######","     ##########","     ##########","     ####","#     #########","#    ###########","##    ############","################"," ##############","  ############","   ##########","    ###  ###","    ##    ##","    ###   ###"].map(r=>r.padEnd(16,' '));
function cactus(o){
  const part=(px,w,h)=>{
    const t=Math.max(6,w*.36);
    x.fillRect(px+(w-t)/2,G-h,t,h);
    x.fillRect(px,G-h*.62,w*.34,5);x.fillRect(px,G-h*.62-h*.2,5,h*.2+5);
    x.fillRect(px+w*.66,G-h*.5,w*.34,5);x.fillRect(px+w-5,G-h*.5-h*.22,5,h*.22+5);
  };
  if(o.k===2){part(o.x,20,o.h);part(o.x+24,20,o.h-8)}else part(o.x,o.w,o.h);
}
function dino(){
  const blink=S.inv>0&&Math.floor(S.t*20)%2===0;
  if(blink)return;
  x.save();
  if(S.duck){x.translate(DX,G);x.scale(1.2,.55);x.translate(0,-48)}else x.translate(DX,G-S.dy-48);
  x.fillStyle=C.ink;
  const f=Math.floor(S.dist/40)%2,air=S.dy>0;
  for(let r=0;r<16;r++)for(let c=0;c<16;c++){
    if(SPR[r][c]!=='#')continue;
    if(r>=13&&!air&&!(f?c>=8:c<8))continue;
    x.fillRect(c*3,r*3,3,3);
  }
  x.restore();
}
function ai(talking){
  const e = edge(), r = 70, cx = e - r + 8 * Math.sin(S.t * 5), cy = G - 70;

  // Fondo circular
  x.fillStyle = C.ai;
  x.beginPath();
  x.arc(cx, cy, r, 0, Math.PI * 2);
  x.fill();

  // Logo de ChatGPT recortado en círculo si ya cargó
  if (chatGPTLogo.complete && chatGPTLogo.naturalWidth !== 0) {
    x.save();
    x.beginPath();
    x.arc(cx, cy, r - 4, 0, Math.PI * 2);
    x.clip();
    x.drawImage(chatGPTLogo, cx - (r - 4), cy - (r - 4), (r - 4) * 2, (r - 4) * 2);
    x.restore();
  }

  // Borde del círculo
  x.strokeStyle = C.ai2;
  x.lineWidth = 6;
  x.beginPath();
  x.arc(cx, cy, r, 0, Math.PI * 2);
  x.stroke();

  x.fillStyle = C.ink;x.font = '700 15px ui-monospace,monospace';x.textAlign = 'left';x.textBaseline = 'alphabetic';x.fillText('ChatGPT', 12, 74);
}
function bubbles(){
  x.font='13px ui-monospace,monospace';x.textBaseline='middle';
  for(const b of S.bub){
    if(b.wait>0){
      const bx=edge()+8,by=G-64;
      x.fillStyle=C.panel;x.strokeStyle=C.ink;x.lineWidth=2;
      x.beginPath();x.roundRect(bx,by,50,26,13);x.fill();x.stroke();
      x.fillStyle=C.ink;
      for(let i=0;i<3;i++){x.beginPath();x.arc(bx+14+i*11,by+13-Math.max(0,Math.sin(S.t*10-i))*3,3,0,7);x.fill()}
    }else{
      x.fillStyle=C.panel;x.strokeStyle=C.ink;x.lineWidth=2;
      x.beginPath();x.roundRect(b.x,G-64,b.w,26,13);x.fill();x.stroke();
      x.fillStyle=C.ink;x.textAlign='left';x.fillText(b.text,b.x+12,G-51);
    }
  }
}
function pad(n){return String(n).padStart(5,'0')}
function overlay(t1,t2,t3){
  x.textAlign='center';x.textBaseline='alphabetic';
  x.fillStyle=C.ink;x.font='700 28px ui-monospace,monospace';x.fillText(t1,W/2+60,112);
  x.fillStyle=C.mute;x.font='15px ui-monospace,monospace';x.fillText(t2,W/2+60,142);x.fillText(t3,W/2+60,166);
}
function draw(){
  const cs=getComputedStyle(document.documentElement);
  for(const k of['bg','ink','ai','ai2','panel','mute','warn'])C[k]=cs.getPropertyValue('--'+k).trim();
  x.save();
  x.fillStyle=C.bg;x.fillRect(0,0,W,H);
  if(S.shake>0)x.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  x.fillStyle=C.mute;
  for(const s of S.specks)x.fillRect(s.x,s.y,3,3);
  x.fillStyle=C.ink;x.fillRect(0,G+1,W,2);
  for(let i=0;i<W/40+2;i++)x.fillRect(((i*40-S.dist*.9)%(W+80)+W+80)%(W+80)-40,G+10,14,2);
  for(const o of S.obs)cactus(o);
  dino();
  ai(S.bub.some(b=>b.wait>0)||S.over);
  bubbles();
  x.restore();
  x.textBaseline='alphabetic';x.textAlign='left';
  x.fillStyle=C.mute;x.font='12px ui-monospace,monospace';x.fillText('Distancia a ChatGPT',16,24);
  x.strokeStyle=C.ink;x.lineWidth=2;x.strokeRect(16,32,160,12);
  x.fillStyle=S.gap<90?C.warn:C.ai;x.fillRect(18,34,156*S.gap/MAXGAP,8);
  x.textAlign='right';x.fillStyle=C.ink;x.font='700 16px ui-monospace,monospace';
  x.fillText('MEJOR '+pad(best)+'   '+pad(score()),W-16,26);
  if(!started)overlay('Escapá de ChatGPT','Saltá los cactus y agachate ante sus mensajes.','Espacio o tocá la pantalla para empezar.');
  else if(S.over)overlay('ChatGPT te alcanzó','Ahora te va a explicar todo en 5 puntos.','Espacio o tocá para reintentar.');
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(started&&!S.over)update(dt);
  else if(S.over)S.overT+=dt;
  S.t+=started?0:dt;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
